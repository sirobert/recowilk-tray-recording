name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_windows_integration:
        description: "Uruchom test prawdziwego kodera Media Foundation"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MeetingAudioRecorder.sln

      - name: Verify format
        run: dotnet format MeetingAudioRecorder.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MeetingAudioRecorder.sln -c Release --no-restore

      - name: Test
        run: dotnet test MeetingAudioRecorder.sln -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Test Media Foundation (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.run_windows_integration
        env:
          MAR_RUN_WINDOWS_INTEGRATION: "1"
        run: dotnet test tests/MeetingAudioRecorder.Audio.Tests/MeetingAudioRecorder.Audio.Tests.csproj -c Release --no-build --no-restore --filter "Category=WindowsIntegration" --logger "trx;LogFileName=media-foundation.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
