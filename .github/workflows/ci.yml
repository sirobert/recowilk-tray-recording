name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MeetingAudioRecorder.sln

      - name: Verify format
        run: dotnet format MeetingAudioRecorder.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MeetingAudioRecorder.sln -c Release --no-restore

      - name: Test
        run: dotnet test MeetingAudioRecorder.sln -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

